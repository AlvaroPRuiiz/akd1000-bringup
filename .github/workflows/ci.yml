name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Static analysis
        run: python -m ruff check .

  simulator:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        akida-version: ["2.19.1", "2.19.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SDK and toolkit
        run: python -m pip install . "akida==${{ matrix.akida-version }}"
      - name: Verify reference artifact
        run: akd1000-bringup verify --id smoke --model models/akida_v1_smoke_test.fbz
      - name: Simulator and virtual mapping
        run: python examples/00_simulator_smoke.py
